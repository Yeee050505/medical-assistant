[project]
name = "medical-backend"
version = "1.0.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".git", "__pycache__", "data", "frontend", "backend/alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI Depends 惯用法

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]
