name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root123
          MYSQL_DATABASE: medical
          MYSQL_USER: medical
          MYSQL_PASSWORD: medical123
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot123 --silent"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s
          --health-timeout 2s
          --health-retries 15
      qdrant:
        image: qdrant/qdrant:v1.19.2
        ports: ["6333:6333"]
    env:
      MYSQL_HOST: 127.0.0.1
      REDIS_HOST: 127.0.0.1
      QDRANT_URL: http://127.0.0.1:6333
      RATE_LIMIT_QPS: 1000
      JWT_SECRET: ci-jwt-secret-32-bytes-minimum!!
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r backend/requirements.txt ruff

      - name: Init database schema and seed data
        env:
          MYSQL_PWD: medical123
        run: mysql -h 127.0.0.1 -u medical medical < docker/mysql/init.sql

      - name: Lint
        run: ruff check backend tests

      - name: Test
        run: pytest tests -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend
